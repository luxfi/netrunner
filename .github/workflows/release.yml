name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: lux-build-amd64
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: netrunner
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: ./netrunner/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
