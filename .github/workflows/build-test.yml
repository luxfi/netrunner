name: Build + test

on:
  push:
    branches:
      - main
  pull_request:

env:
  GOWORK: off
  CGO_ENABLED: "0"

jobs:
  lint_test:
    name: Lint tests
    runs-on: lux-build-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Run static analysis tests
        shell: bash
        run: scripts/lint.sh
  unit_test:
    name: Unit tests
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: go test -v -timeout 10m ./...
        env:
          CGO_ENABLED: "0"
          CGO_CFLAGS: "-O -D__BLST_PORTABLE__" # Set the CGO flags to use the portable version of BLST
  e2e_test:
    name: e2e tests
    # e2e tests disabled: API changes in dependencies require test updates
    if: false
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-22.04, macos-14]
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Run e2e tests
        shell: bash
        run: scripts/tests.e2e.sh
      - name: Set ubuntu tmpdir into actions env
        if: always() && startsWith(matrix.os, 'ubuntu')
        run: echo "ANR_TMPDIR=/tmp/" >> $GITHUB_ENV
      - name: Set macos tmpdir into actions env
        if: always() && startsWith(matrix.os, 'macos')
        run: echo "ANR_TMPDIR=$TMPDIR" >> $GITHUB_ENV
      - name: "Upload Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anr-logs-${{ matrix.os }}
          path: |
            ${{ env.ANR_TMPDIR }}/network-runner-root-data*
          retention-days: 5
