# golangci-lint v2 configuration
version: "2"

run:
  timeout: 10m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell

  settings:
    staticcheck:
      checks:
        - "all"
        - "-SA6002"
        - "-SA1019"
        - "-ST1000"
        - "-ST1021"
        - "-QF1008"

  exclusions:
    generated: lax
    presets:
      - comments
    rules:
      - path: ".*\\.pb\\.go$"
        linters:
          - all
      - path: ".*mock.*"
        linters:
          - all
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - errcheck
        text: "Error return value of .*(Close|Flush|Fprintln|Fprintf|Print|Printf|Println|Write|Signal|Kill|RemoveAll|Sync|Sscanf|MarkFlagRequired).*is not checked"

issues:
  max-same-issues: 0
